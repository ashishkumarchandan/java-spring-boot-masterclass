# Application Properties for 01_installing_mysql_and_dbeaver
spring.application.name=installing-mysql-dbeaver-demo

# DataSource Configuration (Using H2 in-memory mode as fallback if local MySQL is not active)
spring.datasource.url=jdbc:h2:mem:masterclass_db;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# MySQL Production Setup Comment Template:
# spring.datasource.url=jdbc:mysql://localhost:3306/masterclass_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
# spring.datasource.username=devuser
# spring.datasource.password=devpassword

# JPA & Hibernate Settings
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
